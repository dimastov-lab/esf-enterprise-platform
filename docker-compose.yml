services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: esf
      POSTGRES_USER: esf
      POSTGRES_PASSWORD: esf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esf -d esf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
