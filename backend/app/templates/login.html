<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ЭСФ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #1f2937; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .box { background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.35);
           width: 100%; max-width: 360px; padding: 28px; }
    .box h1 { font-size: 18px; margin: 0 0 4px; color: #111827; }
    .box p.sub { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
    label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none;
             border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { background: #fdf0f0; border: 1px solid #f0b9b4; color: #9b1c1c; font-size: 13px;
           padding: 8px 10px; border-radius: 8px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ЭСФ — Вход в систему</h1>
    <p class="sub">Электронные счета-фактуры (STI-007)</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Имя пользователя</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </div>
  <script nonce="{{ request.state.csp_nonce if request else '' }}">
    // Logged out here — clear any locally-cached draft / recent-document data so
    // sensitive values (INN, amounts, counterparty details) don't linger in
    // localStorage on a shared machine.
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('esf_draft_') === 0 || k === 'esf_recent')) localStorage.removeItem(k);
      }
    } catch (_) {}
  </script>
</body>
</html>
