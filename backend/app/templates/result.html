<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЭСФ — Результат {{ number }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef0f3; color: #1b1f24;
           font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .wrap { max-width: 760px; margin: 32px auto; padding: 0 18px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #e2e6ea; border-radius: 12px; padding: 22px;
            display: flex; gap: 24px; align-items: flex-start; }
    .qr { flex: 0 0 auto; text-align: center; }
    .qr img { width: 200px; height: 200px; border: 1px solid #e7eaee; border-radius: 8px; padding: 6px; background: #fff; }
    .qr .cap { font-size: 12px; color: #9aa1ab; margin-top: 6px; }
    .info { flex: 1; min-width: 0; }
    .row { margin-bottom: 14px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; margin-bottom: 4px; }
    .val a { color: #2563eb; text-decoration: none; word-break: break-all; }
    .val a:hover { text-decoration: underline; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .btn { display: inline-block; font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 8px;
           text-decoration: none; border: 1px solid #cfd5dd; background: #fff; color: #1b1f24; cursor: pointer; }
    .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Результат ЭСФ</h1>
    <div class="sub">Номер: {{ number }}</div>

    <div class="card">
      <div class="qr">
        <img src="/qr/{{ uuid }}.png" alt="QR код">
        <div class="cap">Сканируйте для проверки</div>
      </div>
      <div class="info">
        <div class="row">
          <div class="label">Публичная ссылка проверки</div>
          <div class="val"><a href="{{ public_path }}" target="_blank">{{ qr_target }}</a></div>
        </div>
        <div class="row">
          <div class="label">PDF документа</div>
          <div class="val"><a href="/pdf/{{ uuid }}.pdf" target="_blank">/pdf/{{ uuid }}.pdf</a></div>
        </div>

        <div class="btns">
          <a class="btn primary" href="/pdf/{{ uuid }}.pdf" download>Скачать PDF</a>
          <a class="btn" href="/qr/{{ uuid }}.png" download>Скачать QR</a>
          <a class="btn" href="/esf/check-esf?documentUUID={{ uuid }}" target="_blank">Открыть публичную страницу</a>
          <a class="btn" href="/dashboard">К списку</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
