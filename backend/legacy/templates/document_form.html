{% extends "base.html" %}
{% block title %}New ESF — ESF Platform{% endblock %}
{% block body %}
<div class="container">
  <div class="page-header">
    <h1>Create ESF Document</h1>
    <a href="/dashboard" class="btn btn-secondary">← Back</a>
  </div>
  <div class="card" style="max-width:680px;">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/documents/new">
      <div class="form-group">
        <label for="title">Document Title *</label>
        <input type="text" id="title" name="title" placeholder="e.g. Application for business registration" required>
      </div>
      <div class="form-group">
        <label for="applicant_name">Applicant Full Name *</label>
        <input type="text" id="applicant_name" name="applicant_name" placeholder="e.g. John Smith" required>
      </div>
      <div class="form-group">
        <label for="applicant_id">Applicant ID / Tax Number *</label>
        <input type="text" id="applicant_id" name="applicant_id" placeholder="e.g. 123456789" required>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Additional details or notes..."></textarea>
      </div>
      <div style="display:flex;gap:.8rem;margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary">Save Draft</button>
        <a href="/dashboard" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
