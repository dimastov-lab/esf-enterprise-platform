<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ESF Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #2c3e50; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.3); padding: 2.5rem; width: 100%; max-width: 380px; }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo h1 { font-size: 1.6rem; font-weight: 800; color: #2c3e50; }
    .login-logo p { color: #7f8c8d; font-size: .88rem; margin-top: .3rem; }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; margin-bottom: .4rem; font-weight: 600; font-size: .88rem; color: #2c3e50; }
    input { width: 100%; padding: .65rem .9rem; border: 1.5px solid #dde1e7; border-radius: 6px; font-size: .95rem; outline: none; transition: border-color .2s; }
    input:focus { border-color: #2980b9; }
    .btn-login { width: 100%; padding: .7rem; background: #2980b9; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: .5rem; transition: background .2s; }
    .btn-login:hover { background: #2471a3; }
    .alert { padding: .7rem .9rem; background: #fdf0f0; color: #c0392b; border: 1px solid #f5c6cb; border-radius: 6px; font-size: .88rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <h1>⚡ ESF Platform</h1>
      <p>Electronic Submission Form System</p>
    </div>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>
</body>
</html>
