<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ESF Platform{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

    /* NAV */
    nav { background: #2c3e50; color: white; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    nav .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: .5px; color: #f0f2f5; }
    nav .nav-links a { color: #bdc3c7; text-decoration: none; margin-left: 1.5rem; font-size: .9rem; }
    nav .nav-links a:hover { color: white; }
    nav .user-info { font-size: .85rem; color: #95a5a6; }

    /* LAYOUT */
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .page-header { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: #2c3e50; }

    /* CARDS */
    .card { background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 1.5rem; margin-bottom: 1.5rem; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1.2rem; border-radius: 6px; border: none; cursor: pointer; font-size: .9rem; font-weight: 600; text-decoration: none; transition: opacity .15s, transform .1s; }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary { background: #2980b9; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-danger  { background: #e74c3c; color: white; }
    .btn-secondary { background: #7f8c8d; color: white; }
    .btn-sm { padding: .35rem .8rem; font-size: .8rem; }

    /* BADGES */
    .badge { display: inline-block; padding: .25rem .65rem; border-radius: 20px; font-size: .75rem; font-weight: 700; text-transform: uppercase; }
    .badge-draft { background: #fef9e7; color: #f39c12; border: 1px solid #f9ca24; }
    .badge-published { background: #eafaf1; color: #27ae60; border: 1px solid #82e0aa; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; text-align: left; padding: .75rem 1rem; font-size: .8rem; font-weight: 700; text-transform: uppercase; color: #7f8c8d; border-bottom: 2px solid #e9ecef; }
    td { padding: .75rem 1rem; border-bottom: 1px solid #f0f2f5; font-size: .9rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }

    /* FORMS */
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: .4rem; font-weight: 600; font-size: .88rem; color: #2c3e50; }
    input[type=text], input[type=password], textarea, select { width: 100%; padding: .6rem .9rem; border: 1.5px solid #dde1e7; border-radius: 6px; font-size: .95rem; background: #fff; outline: none; transition: border-color .2s; }
    input:focus, textarea:focus { border-color: #2980b9; }
    textarea { resize: vertical; min-height: 100px; }

    /* ALERT */
    .alert { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: .9rem; }
    .alert-error { background: #fdf0f0; color: #c0392b; border: 1px solid #f5c6cb; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 3rem 1rem; color: #95a5a6; }
    .empty-state p { margin-bottom: 1rem; font-size: 1rem; }

    /* DETAIL GRID */
    .detail-grid { display: grid; grid-template-columns: 200px 1fr; gap: .6rem 1rem; align-items: start; }
    .detail-label { font-weight: 600; color: #7f8c8d; font-size: .88rem; padding-top: .1rem; }
    .detail-value { font-size: .95rem; }
  </style>
</head>
<body>
{% block nav %}
<nav>
  <span class="brand">⚡ ESF Platform</span>
  <div style="display:flex;align-items:center;gap:1.5rem;">
    {% if username %}
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/documents/new">New ESF</a>
    </div>
    <span class="user-info">{{ username }}</span>
    <a href="/logout" style="color:#e74c3c;font-size:.85rem;text-decoration:none;margin-left:.5rem;">Logout</a>
    {% endif %}
  </div>
</nav>
{% endblock %}
{% block body %}{% endblock %}
</body>
</html>
