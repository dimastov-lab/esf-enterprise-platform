# Tooling config for the ESF backend (lint / format / coverage).
[tool.ruff]
line-length = 110
target-version = "py312"   # runtime is python:3.12-slim (see backend/Dockerfile)
extend-exclude = ["alembic/versions", ".venv", "legacy"]

[tool.ruff.lint]
# Enforced gate: F = pyflakes (undefined names, unused imports/vars — real bugs),
# I = import order. High signal, zero noise — passes clean today.
# (B = bugbear and UP = pyupgrade are valuable but would require a large one-off
#  modernization sweep; opt them in later behind their own PR.)
select = ["F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/dev_sample.py", "app/routers/dev_preview.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# -n auto: run tests in parallel (requires pytest-xdist).
# --dist=loadfile: keep tests from the same file on one worker — avoids cross-worker
#   shared-state races (in-memory rate-limit store, autouse reset fixtures).
# -m "not slow": skip PDF-rendering and sleep-based tests by default; CI overrides
#   with -m "" to run the full suite.
addopts = "-n auto --dist=loadfile -m 'not slow'"
markers = [
    "slow: marks tests as slow — PDF rendering, sleep-based timing (override with -m '')",
]
