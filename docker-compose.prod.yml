# Production stack for the ESF Enterprise Platform.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Provide TLS certs at infra/nginx/certs/{fullchain.pem,privkey.pem} (see INSTALL.md).
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Internal only — not published to the host.

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: esf-platform:1.0-rc1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: ${TZ:-UTC}
    volumes:
      - esf_storage:/app/storage        # persists generated QR PNGs
    healthcheck:
      # /readyz verifies DB connectivity (curl -f fails on the 503 a DB-down app returns),
      # so a broken DB marks the container unhealthy instead of passing a shallow check.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Internal only — fronted by nginx.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/app/static:/srv/static:ro     # static served directly by nginx
      - ./infra/nginx/certs:/etc/nginx/certs:ro # TLS certs (you provide)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pg_data:
  esf_storage:
