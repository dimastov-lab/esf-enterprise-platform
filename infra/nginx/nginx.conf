# Production reverse proxy for the ESF Enterprise Platform.
# Terminates TLS, serves /static directly, proxies everything else to the app.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 10m;          # ESF docs are small; cap uploads/bodies

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/pdf;

    upstream esf_app { server app:8000; }

    # ---- HTTP: health probe + redirect everything else to HTTPS ----
    server {
        listen 80;
        server_name _;
        location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        # Static assets (CSS, fonts, images) served directly from the mounted volume.
        location /static/ {
            alias /srv/static/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Application (dynamic routes, including /qr/*.png and /pdf/*.pdf).
        location / {
            proxy_pass         http://esf_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;   # PDF render ~2-3s; headroom for load
        }
    }
}
