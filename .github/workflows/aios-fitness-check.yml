name: AIOS Architecture Fitness Check
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tools/**'
  pull_request:
    paths:
      - '**.py'
      - 'tools/**'

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run fitness check
        run: python tools/fitness_check.py .
