name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: esf
          POSTGRES_PASSWORD: esf
          POSTGRES_DB: esf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://esf:esf@localhost:5432/esf
      SECRET_KEY: ci-test-secret-not-for-production
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        # --cov-fail-under is a regression floor (raise it as coverage grows); the
        # broad end-to-end suite is comfortably above it.
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt

  # The deploy artifact is the Docker image — build it in CI so a broken
  # Dockerfile/entrypoint/native-lib set can never pass with a green test job.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t esf-platform:ci backend

      - name: Smoke-test the image (the app imports & boots inside the container)
        run: |
          docker run --rm \
            -e ENVIRONMENT=development \
            -e SECRET_KEY=ci-smoke-not-for-production \
            --entrypoint python esf-platform:ci \
            -c "import app.main; print('app import OK')"
