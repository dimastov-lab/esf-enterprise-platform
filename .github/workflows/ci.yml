name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast fail-fast gate — PRs know within ~20s whether lint is broken.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: esf
          POSTGRES_PASSWORD: esf
          POSTGRES_DB: esf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://esf:esf@localhost:5432/esf
      SECRET_KEY: ci-test-secret-not-for-production
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        # -m '' overrides the default "not slow" from pyproject.toml addopts so CI
        # always runs the full suite including PDF-rendering and sleep-based tests.
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70 -m ''

  # Runs in parallel with test — CVE scan doesn't block or wait for pytest.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt

  # Buildx + GHA layer cache cuts cold build from ~4 min to ~1 min after first run.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: esf-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (the app imports & boots inside the container)
        run: |
          docker run --rm \
            -e ENVIRONMENT=development \
            -e SECRET_KEY=ci-smoke-not-for-production \
            --entrypoint python esf-platform:ci \
            -c "import app.main; print('app import OK')"
