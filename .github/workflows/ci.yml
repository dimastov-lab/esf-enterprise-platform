name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: esf
          POSTGRES_PASSWORD: esf
          POSTGRES_DB: esf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://esf:esf@localhost:5432/esf
      SECRET_KEY: ci-test-secret-not-for-production
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt
