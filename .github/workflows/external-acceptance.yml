name: External acceptance probe

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public production HTTPS origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public deployment
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: bash scripts/external_acceptance_probe.sh | tee external-acceptance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: external-acceptance-${{ github.run_id }}
          path: external-acceptance.txt
          retention-days: 90

